# =============================================================================
# config.yaml — Analisi e Simulazione: La co-evoluzione di un sistema agentico in una rete sociale
# Unica fonte di verita' per tutti i parametri di runtime.
# Modifica SOLO questa sezione per switchare tra locale e Kaggle.
# =============================================================================

# ---------------------------------------------------------------------------
# Execution Context
# ---------------------------------------------------------------------------
execution:
  mode: "kaggle"           # "local" | "kaggle"
  random_seed: 42
  log_level: "DEBUG"       # "DEBUG" | "INFO" | "WARNING"

# ---------------------------------------------------------------------------
# Paths  (relativi alla project root; risolti da src/utils/config.py)
# ---------------------------------------------------------------------------
paths:
  data_raw:        "data/raw"
  data_processed:  "data/processed"
  results:         "results"
  figures:         "results/figures"
  logs:            "results/logs"
  checkpoints:     "results/checkpoints"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  name:           "ogbl-collab"
  ogb_root:       "data/raw"       # dove ogb scarica i file
  year_filter:    null             # null = tutti gli anni; int = solo archi fino a quell'anno

# ---------------------------------------------------------------------------
# Subgraph Extraction
# ---------------------------------------------------------------------------
subgraph:
  strategy:       "forest_fire"    # "bfs_seed" | "random_walk" | "random_nodes" | "forest_fire"
  target_nodes:   5000            # nodi nel sottografo: > 235k per prendere tutto l'LCC
  min_component:  200              # scarta componenti connesse con meno di N nodi
  seed_strategy:  "high_degree"    # nodo di partenza BFS: "high_degree" | "random"
  forward_prob:   0.5              # Forest Fire: probabilita' propagazione (0.4-0.7)
  output_file:    "data/processed/subgraph.gpickle"

# ---------------------------------------------------------------------------
# Graph Metrics  (Fase 0)
# ---------------------------------------------------------------------------
metrics:
  compute_betweenness: false       # costoso su grafi grandi; true solo su sottografo
  betweenness_sample:  500         # nodi campionati per stima betweenness
  compute_diameter:    false       # O(n^2) — disabilitato per default
  pagerank_alpha:      0.85        # damping factor PageRank
  katz_alpha:          0.01

# ---------------------------------------------------------------------------
# Community Detection  (Fase 0)
# ---------------------------------------------------------------------------
community:
  algorithm:      "label_propagation"        # "louvain" | "label_propagation"
  resolution:     1.0              # parametro Louvain (>1 community piu' piccole)
  output_file:    "data/processed/community_map.json"

# ---------------------------------------------------------------------------
# Agent / Simulation  (Fase 1-2)
# ---------------------------------------------------------------------------
simulation:
  max_steps:             60
  topic:                 "echo_chamber_polarization"
  topic_description: >
    The spread of polarizing narratives within academic collaboration networks,
    where researchers selectively engage only with like-minded peers, forming
    self-reinforcing information bubbles that reduce cross-community knowledge.
  initial_infection_rate: 0.15    # % nodi inizialmente in stato I (pazienti zero)
  activation_probability: 0.15    # % di nodi attivati ad ogni step (= notebook Kaggle)
  memory_window:          3        # sliding window: ultimi N post dei vicini
  rewiring_cooldown:      2        # step di cooldown tra rewiring consecutivi
  checkpoint_every:       1       # salva checkpoint ogni N step
  seeder_strategy:        "combined" # strategia selezione pazienti zero
  min_resistance_exposure: 0.12      # S -> R richiede almeno questa frazione di vicini I
  resistance_susceptibility_cutoff: 0.5  # ... e susceptibility LLM sotto questa soglia
  base_threshold_mean:    0.3        # soglia LT base per nodo ~ N(mean, std), clippata in [0.05, 0.95]
  base_threshold_std:     0.1
  relapse_threshold:      0.6        # R -> I se frazione vicini I >= soglia ...
  relapse_min_susceptibility: 0.8    # ... susceptibility > valore e proposed_state = I
  max_llm_failure_rate:   0.5        # step interrotto se eccezioni + fallback LLM superano questa quota
  smart_cache:            false      # true = riusa la risposta se feed/vicinato invariati (congela gli agenti)

# ---------------------------------------------------------------------------
# LLM Backend  (Fase 1-2)
# ---------------------------------------------------------------------------
llm:
  backend: "local"         # "api" | "local"  (local = server OpenAI-compatibile, vLLM su Kaggle)
  max_concurrent_requests: 150   # vLLM fa il batching (= notebook Kaggle); Ollama: 1

  api:
    provider:      "gemini"
    model:         "gemini-2.5-flash-lite"
    temperature:   0.7
    max_tokens:    512
    api_key_env:   "GEMINI_API_KEY"
    timeout:       300             # secondi per richiesta, poi retry e fallback

  local:
    base_url:      "http://localhost:8000/v1"                # vLLM (Ollama: http://localhost:11434/v1)
    model:         "casperhansen/llama-3-8b-instruct-awq"    # = notebook Kaggle
    temperature:   0.7
    max_tokens:    512
    timeout:       300             # secondi per richiesta, poi retry e fallback

  token_budget:
    warn_at:       999999999
    hard_limit:    999999999

# ---------------------------------------------------------------------------
# GNN  (Fase 2)
# ---------------------------------------------------------------------------
gnn:
  model:              "graphsage"    # NON usato: il modello e' sempre GraphSAGE
  hidden_dim:         128
  num_layers:         2              # NON usato: il modello ha sempre 2 layer
  dropout:            0.3            # NON usato: nessun dropout nel modello
  lr:                 0.001
  epochs_per_step:    15             # fine-tuning step ad ogni tick temporale
  embedding_dim:      128
  rewire_threshold_add:    0.65      # score > soglia -> aggiungi arco
  rewire_threshold_remove: 0.35      # score < soglia -> rimuovi arco
  max_new_edges_per_step:  50        # in modalita' swap: archi sostituiti per step
  rewire_mode:        "swap"         # swap = ogni arco aggiunto sostituisce l'esistente con score minimo
                                     # threshold = vecchio comportamento (rimozioni solo sotto soglia)
  rewire_candidate_sources:     500  # nodi sorgente esplorati a ogni step (diversi per step)
  rewire_candidates_per_source: 5    # coppie 2-hop candidate per sorgente
  embedding_file:     "data/processed/embeddings.npy"
  use_torch:          true           # true = PyTorch (Kaggle/GPU), false = NumPy (locale)

# ---------------------------------------------------------------------------
# Influence Maximization / CELF  (Fase 3)
# ---------------------------------------------------------------------------
influence:
  budget_k:           20             # numero seed fact-checker da iniettare
  simulation_rounds:  30            # Monte Carlo per stima spread (solo celf_objective = "ic")
  celf_objective:     "threshold"    # threshold = obiettivo allineato alla StateMachine (deterministico)
                                     # ic = Independent Cascade Monte Carlo (modello originale)
  reach_hops:         1              # raggio (in salti) della metrica di reach dei fact-checker
  activation_threshold: 0.4         # soglia infection_rate per attivare CELF (notebook: FORCE_INJECTION la ignora)
  celf_interval:      15             # NON usato: CELF viene eseguito una sola volta a inizio Fase 3
  fc_resistance_threshold: 0.25      # I -> R se frazione vicini F >= soglia
  fc_protection_threshold: 0.10      # S -> R (inoculazione) se frazione vicini F >= soglia
